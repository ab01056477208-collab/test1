<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로또 번호 추첨기</title>
    <style>
      :root {
        --bg: #fffaf0;
        --body-grad: linear-gradient(135deg, #fff7e6, #fffaf0 40%, #fff1d1);
        --card: #ffffff;
        --card-alt: #faf7f2;
        --primary: #ffb000;
        --primary-dark: #e79b00;
        --text: #222222;
        --muted: #666666;
        --line: #f0e7d6;
        --ball1: #fbc531;
        --ball2: #4cd137;
        --ball3: #00a8ff;
        --ball4: #9c88ff;
        --ball5: #e84118;
        --ball6: #7f8fa6;
        --shadow: rgba(0, 0, 0, 0.1);
        --header-grad: linear-gradient(135deg, #ffcc52, #ffb000);
        --header-text: #1f1f1f;
        --secondary-bg: #f5f5f5;
        --secondary-text: #222222;
        --result-bg: #fff9ed;
        --result-border: #ffe3a4;
        --result-text: #7a5200;
        --toggle-bg: rgba(255, 255, 255, 0.35);
        --toggle-text: #1f1f1f;
      }

      html[data-theme="dark"] {
        --bg: #14161c;
        --body-grad: linear-gradient(135deg, #15171f, #1b1e27 40%, #11131a);
        --card: #1e212b;
        --card-alt: #262a35;
        --primary: #ffb000;
        --primary-dark: #ffc233;
        --text: #f0f0f3;
        --muted: #a7acb8;
        --line: #343a48;
        --shadow: rgba(0, 0, 0, 0.5);
        --header-grad: linear-gradient(135deg, #342a1f, #4a3a1a);
        --header-text: #ffe8b8;
        --secondary-bg: #2b2f3b;
        --secondary-text: #f0f0f3;
        --result-bg: #2c2516;
        --result-border: #5a4522;
        --result-text: #ffd98a;
        --toggle-bg: rgba(255, 255, 255, 0.1);
        --toggle-text: #f0f0f3;
      }

      * { box-sizing: border-box; }

      html, body {
        transition: background 0.2s ease, color 0.2s ease;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, sans-serif;
        background: var(--body-grad);
        color: var(--text);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 24px;
        position: relative;
      }

      .theme-toggle {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 16px;
        border-radius: 999px;
        background: var(--toggle-bg);
        backdrop-filter: blur(6px);
        color: var(--toggle-text);
        border: 1px solid var(--line);
        box-shadow: 0 4px 14px var(--shadow);
      }

      .theme-toggle .icon {
        font-size: 1.1rem;
        line-height: 1;
      }

      .app {
        width: min(860px, 100%);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 24px;
        box-shadow: 0 20px 50px var(--shadow);
        overflow: hidden;
        transition: background 0.2s ease, border-color 0.2s ease;
      }

      .header {
        background: var(--header-grad);
        color: var(--header-text);
        padding: 28px 32px;
        text-align: center;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 4vw, 3rem);
      }

      .subtitle {
        margin-top: 8px;
        font-size: 1rem;
        opacity: 0.8;
      }

      .content {
        padding: 32px;
      }

      .controls {
        display: flex;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 28px;
      }

      button {
        border: none;
        border-radius: 12px;
        font-size: 1rem;
        font-weight: 700;
        padding: 14px 22px;
        cursor: pointer;
        transition: transform 0.15s ease, opacity 0.15s ease;
      }

      button:hover { transform: translateY(-1px); }
      button:active { transform: translateY(0); }

      .primary {
        background: var(--primary);
        color: #1f1f1f;
      }

      .secondary {
        background: var(--secondary-bg);
        color: var(--secondary-text);
      }

      .drawn-numbers {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 14px;
        margin: 24px 0 18px;
      }

      .ball {
        width: 70px;
        height: 70px;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 1.7rem;
        font-weight: 800;
        color: white;
        box-shadow: inset 0 -6px 10px rgba(0,0,0,0.12), 0 8px 16px rgba(0,0,0,0.08);
      }

      .ball.empty {
        background: linear-gradient(135deg, #f3f4f6, #dfe5ec);
        color: #8a8a8a;
        box-shadow: inset 0 -6px 10px rgba(0,0,0,0.06);
      }

      .ball[data-value="1"], .ball[data-value="4"], .ball[data-value="7"], .ball[data-value="10"], .ball[data-value="13"], .ball[data-value="16"], .ball[data-value="19"], .ball[data-value="22"], .ball[data-value="25"], .ball[data-value="28"], .ball[data-value="31"], .ball[data-value="34"], .ball[data-value="37"], .ball[data-value="40"], .ball[data-value="43"], .ball[data-value="46"] {
        background: linear-gradient(135deg, var(--ball1), #f0b80f);
      }

      .ball[data-value="2"], .ball[data-value="5"], .ball[data-value="8"], .ball[data-value="11"], .ball[data-value="14"], .ball[data-value="17"], .ball[data-value="20"], .ball[data-value="23"], .ball[data-value="26"], .ball[data-value="29"], .ball[data-value="32"], .ball[data-value="35"], .ball[data-value="38"], .ball[data-value="41"], .ball[data-value="44"], .ball[data-value="47"] {
        background: linear-gradient(135deg, var(--ball2), #1faa2d);
      }

      .ball[data-value="3"], .ball[data-value="6"], .ball[data-value="9"], .ball[data-value="12"], .ball[data-value="15"], .ball[data-value="18"], .ball[data-value="21"], .ball[data-value="24"], .ball[data-value="27"], .ball[data-value="30"], .ball[data-value="33"], .ball[data-value="36"], .ball[data-value="39"], .ball[data-value="42"], .ball[data-value="45"], .ball[data-value="48"], .ball[data-value="49"] {
        background: linear-gradient(135deg, var(--ball3), #007dc3);
      }

      .ball[data-value="50"] {
        background: linear-gradient(135deg, #7258d8, #5842c7);
      }

      .extra-results {
        display: none;
        margin: 8px 0 18px;
        padding: 18px 20px;
        border-radius: 16px;
        background: var(--card-alt);
        border: 1px solid var(--line);
      }

      .extra-results.show {
        display: block;
      }

      .extra-title {
        font-size: 0.95rem;
        font-weight: 700;
        color: var(--muted);
        margin-bottom: 14px;
        text-align: center;
      }

      .extra-row {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        justify-content: center;
        margin-bottom: 10px;
      }

      .extra-row:last-child {
        margin-bottom: 0;
      }

      .extra-label {
        width: 28px;
        font-weight: 800;
        color: var(--primary-dark);
        text-align: center;
      }

      .ball.mini {
        width: 40px;
        height: 40px;
        font-size: 0.95rem;
      }

      .result-box {
        display: none;
        padding: 20px 24px;
        border-radius: 16px;
        background: var(--result-bg);
        border: 1px solid var(--result-border);
        text-align: center;
        font-size: 1.05rem;
        color: var(--result-text);
      }

      .result-box.show {
        display: block;
      }

      .meta {
        display: grid;
        grid-template-columns: repeat(2, minmax(160px, 1fr));
        gap: 16px;
        margin-top: 28px;
      }

      .card {
        background: var(--card-alt);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 18px 20px;
        transition: background 0.2s ease, border-color 0.2s ease;
      }

      .label {
        display: block;
        color: var(--muted);
        font-size: 0.85rem;
        margin-bottom: 10px;
      }

      .value {
        font-size: 1.5rem;
        font-weight: 800;
      }

      @media (max-width: 640px) {
        .content { padding: 22px 18px; }
        .header { padding: 22px 18px; }

        .ball {
          width: 54px;
          height: 54px;
          font-size: 1.3rem;
        }

        .ball.mini {
          width: 34px;
          height: 34px;
          font-size: 0.85rem;
        }

        .meta {
          grid-template-columns: 1fr;
        }

        .theme-toggle {
          top: 12px;
          right: 12px;
          padding: 10px 12px;
        }

        .theme-toggle #themeLabel {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="다크 모드 전환" aria-pressed="false">
      <span class="icon" id="themeIcon">🌙</span>
      <span id="themeLabel">다크 모드</span>
    </button>

    <div class="app">
      <div class="header">
        <h1>로또 번호 추첨기</h1>
        <div class="subtitle">행운의 숫자를 뽑아보세요</div>
      </div>

      <div class="content">
        <div class="controls">
          <button class="primary" id="drawBtn">번호 뽑기</button>
          <button class="secondary" id="drawExtraBtn">5게임 추가 뽑기</button>
          <button class="secondary" id="resetBtn">초기화</button>
        </div>

        <div class="drawn-numbers" id="drawnNumbers" aria-live="polite">
          <div class="ball empty">?</div>
          <div class="ball empty">?</div>
          <div class="ball empty">?</div>
          <div class="ball empty">?</div>
          <div class="ball empty">?</div>
          <div class="ball empty">?</div>
        </div>

        <div class="result-box" id="resultBox">🎉 오늘의 로또 번호가 생성되었습니다!</div>

        <div class="extra-results" id="extraResults" aria-live="polite">
          <div class="extra-title">🍀 추가 5게임</div>
        </div>

        <div class="meta">
          <div class="card">
            <span class="label">추첨 회차</span>
            <div class="value" id="roundValue">-</div>
          </div>

          <div class="card">
            <span class="label">추첨 날짜</span>
            <div class="value" id="dateValue">-</div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const themeToggle = document.getElementById('themeToggle');
      const themeIcon = document.getElementById('themeIcon');
      const themeLabel = document.getElementById('themeLabel');
      const THEME_KEY = 'lotto-theme';

      function applyTheme(theme) {
        if (theme === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
          themeIcon.textContent = '☀️';
          themeLabel.textContent = '라이트 모드';
          themeToggle.setAttribute('aria-pressed', 'true');
        } else {
          document.documentElement.removeAttribute('data-theme');
          themeIcon.textContent = '🌙';
          themeLabel.textContent = '다크 모드';
          themeToggle.setAttribute('aria-pressed', 'false');
        }
      }

      function initTheme() {
        const saved = localStorage.getItem(THEME_KEY);
        if (saved) {
          applyTheme(saved);
          return;
        }
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        applyTheme(prefersDark ? 'dark' : 'light');
      }

      themeToggle.addEventListener('click', () => {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        const next = isDark ? 'light' : 'dark';
        applyTheme(next);
        localStorage.setItem(THEME_KEY, next);
      });

      initTheme();

      const drawBtn = document.getElementById('drawBtn');
      const drawExtraBtn = document.getElementById('drawExtraBtn');
      const resetBtn = document.getElementById('resetBtn');
      const drawnNumbers = document.getElementById('drawnNumbers');
      const resultBox = document.getElementById('resultBox');
      const extraResults = document.getElementById('extraResults');
      const roundValue = document.getElementById('roundValue');
      const dateValue = document.getElementById('dateValue');
      const GAME_LABELS = ['A', 'B', 'C', 'D', 'E'];

      function randomNumberSet() {
        const numbers = new Set();
        while (numbers.size < 6) {
          const value = Math.floor(Math.random() * 45) + 1;
          numbers.add(value);
        }
        return [...numbers].sort((a, b) => a - b);
      }

      function updateBalls(values) {
        const balls = drawnNumbers.querySelectorAll('.ball');
        balls.forEach((ball, index) => {
          const value = values[index];
          ball.textContent = value ?? '?';
          ball.classList.toggle('empty', value === undefined);
          if (value !== undefined) {
            ball.setAttribute('data-value', value);
          } else {
            ball.removeAttribute('data-value');
          }
        });
      }

      function renderExtraGames() {
        const rowsHtml = GAME_LABELS.map((label) => {
          const numbers = randomNumberSet();
          const ballsHtml = numbers
            .map((value) => `<div class="ball mini" data-value="${value}">${value}</div>`)
            .join('');
          return `<div class="extra-row"><span class="extra-label">${label}</span>${ballsHtml}</div>`;
        }).join('');
        extraResults.innerHTML = `<div class="extra-title">🍀 추가 5게임</div>${rowsHtml}`;
        extraResults.classList.add('show');
      }

      function setDateInfo() {
        const now = new Date();
        const round = Math.floor((Date.now() - new Date('2024-01-01').getTime()) / (1000 * 60 * 60 * 24 * 7)) + 1;
        roundValue.textContent = `${round}회`;
        dateValue.textContent = now.toLocaleDateString('ko-KR', {
          year: 'numeric',
          month: 'long',
          day: 'numeric'
        });
      }

      drawBtn.addEventListener('click', () => {
        const numbers = randomNumberSet();
        updateBalls(numbers);
        resultBox.classList.add('show');
        resultBox.textContent = `🎉 오늘의 로또 번호: ${numbers.join(', ')}`;
      });

      drawExtraBtn.addEventListener('click', () => {
        renderExtraGames();
      });

      resetBtn.addEventListener('click', () => {
        updateBalls([undefined, undefined, undefined, undefined, undefined, undefined]);
        resultBox.classList.remove('show');
        extraResults.classList.remove('show');
        extraResults.innerHTML = '<div class="extra-title">🍀 추가 5게임</div>';
      });

      setDateInfo();
      updateBalls([undefined, undefined, undefined, undefined, undefined, undefined]);
    </script>
  </body>
</html>
