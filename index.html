<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>남성 코디 추천 챗봇</title>
    <style>
      :root {
        --bg: #fffaf0;
        --body-grad: linear-gradient(135deg, #fff7e6, #fffaf0 40%, #fff1d1);
        --card: #ffffff;
        --card-alt: #faf7f2;
        --primary: #ffb000;
        --primary-dark: #e79b00;
        --text: #222222;
        --muted: #666666;
        --line: #f0e7d6;
        --shadow: rgba(0, 0, 0, 0.1);
        --header-grad: linear-gradient(135deg, #ffcc52, #ffb000);
        --header-text: #1f1f1f;
        --secondary-bg: #f5f5f5;
        --secondary-text: #222222;
        --result-bg: #fff9ed;
        --result-border: #ffe3a4;
        --result-text: #7a5200;
        --toggle-bg: rgba(255, 255, 255, 0.35);
        --toggle-text: #1f1f1f;
        --error-bg: #fdecea;
        --error-border: #f5c6cb;
        --error-text: #a12a2a;
        --bot-bubble: #f1f1f4;
        --user-bubble: #ffb000;
        --user-bubble-text: #1f1f1f;
      }

      html[data-theme="dark"] {
        --bg: #14161c;
        --body-grad: linear-gradient(135deg, #15171f, #1b1e27 40%, #11131a);
        --card: #1e212b;
        --card-alt: #262a35;
        --primary: #ffb000;
        --primary-dark: #ffc233;
        --text: #f0f0f3;
        --muted: #a7acb8;
        --line: #343a48;
        --shadow: rgba(0, 0, 0, 0.5);
        --header-grad: linear-gradient(135deg, #342a1f, #4a3a1a);
        --header-text: #ffe8b8;
        --secondary-bg: #2b2f3b;
        --secondary-text: #f0f0f3;
        --result-bg: #2c2516;
        --result-border: #5a4522;
        --result-text: #ffd98a;
        --toggle-bg: rgba(255, 255, 255, 0.1);
        --toggle-text: #f0f0f3;
        --error-bg: #3a2222;
        --error-border: #6b3838;
        --error-text: #ff9b9b;
        --bot-bubble: #2b2f3b;
        --user-bubble: #ffb000;
        --user-bubble-text: #1f1f1f;
      }

      * { box-sizing: border-box; }

      html, body {
        transition: background 0.2s ease, color 0.2s ease;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, sans-serif;
        background: var(--body-grad);
        color: var(--text);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 24px;
        position: relative;
      }

      .theme-toggle {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 16px;
        border-radius: 999px;
        background: var(--toggle-bg);
        backdrop-filter: blur(6px);
        color: var(--toggle-text);
        border: 1px solid var(--line);
        box-shadow: 0 4px 14px var(--shadow);
      }

      .theme-toggle .icon {
        font-size: 1.1rem;
        line-height: 1;
      }

      .app {
        width: min(860px, 100%);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 24px;
        box-shadow: 0 20px 50px var(--shadow);
        overflow: hidden;
        transition: background 0.2s ease, border-color 0.2s ease;
      }

      .header {
        background: var(--header-grad);
        color: var(--header-text);
        padding: 28px 32px;
        text-align: center;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.7rem, 4vw, 2.6rem);
      }

      .subtitle {
        margin-top: 8px;
        font-size: 1rem;
        opacity: 0.85;
      }

      .content {
        padding: 32px;
      }

      /* ===== Chat UI ===== */
      .chat-window {
        display: flex;
        flex-direction: column;
        gap: 14px;
        max-height: 520px;
        overflow-y: auto;
        padding: 8px 4px 16px;
        margin-bottom: 16px;
      }

      .message {
        display: flex;
        width: 100%;
      }

      .message.bot { justify-content: flex-start; }
      .message.user { justify-content: flex-end; }

      .bubble {
        max-width: 80%;
        padding: 12px 16px;
        border-radius: 16px;
        line-height: 1.5;
        font-size: 0.97rem;
        white-space: pre-line;
      }

      .message.bot .bubble {
        background: var(--bot-bubble);
        color: var(--text);
        border-bottom-left-radius: 4px;
      }

      .message.user .bubble {
        background: var(--user-bubble);
        color: var(--user-bubble-text);
        border-bottom-right-radius: 4px;
        font-weight: 700;
      }

      .step-panel {
        border-top: 1px solid var(--line);
        padding-top: 16px;
      }

      .group {
        margin-bottom: 14px;
      }

      .group:last-child { margin-bottom: 0; }

      .group-label {
        font-size: 0.85rem;
        font-weight: 700;
        color: var(--muted);
        margin-bottom: 8px;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .chip {
        border: 1px solid var(--line);
        background: var(--card-alt);
        color: var(--text);
        border-radius: 999px;
        padding: 9px 16px;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s ease, transform 0.1s ease, color 0.15s ease;
      }

      .chip:hover { transform: translateY(-1px); }

      .chip.selected {
        background: var(--primary);
        color: #1f1f1f;
        border-color: var(--primary-dark);
      }

      .number-fields {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .number-fields .field {
        flex: 1;
        min-width: 120px;
        display: grid;
        gap: 6px;
      }

      .number-fields label {
        font-size: 0.85rem;
        font-weight: 700;
        color: var(--muted);
      }

      .number-fields input {
        font-family: inherit;
        font-size: 1rem;
        padding: 11px 14px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--card-alt);
        color: var(--text);
      }

      .step-actions {
        margin-top: 16px;
        display: flex;
        justify-content: flex-end;
        gap: 10px;
      }

      button {
        border: none;
        border-radius: 12px;
        font-size: 1rem;
        font-weight: 700;
        padding: 12px 20px;
        cursor: pointer;
        transition: transform 0.15s ease, opacity 0.15s ease;
        font-family: inherit;
      }

      button:hover { transform: translateY(-1px); }
      button:active { transform: translateY(0); }

      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
      }

      .primary {
        background: var(--primary);
        color: #1f1f1f;
      }

      .secondary {
        background: var(--secondary-bg);
        color: var(--secondary-text);
      }

      .quick-replies {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 4px;
      }

      .quick-replies button {
        padding: 10px 16px;
        font-size: 0.9rem;
      }

      /* ===== Recommendation cards ===== */
      .recommend-wrap {
        display: grid;
        gap: 16px;
        margin-top: 4px;
      }

      .recommend-card {
        background: var(--card-alt);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 18px 20px;
      }

      .recommend-title {
        font-size: 1.1rem;
        font-weight: 800;
        color: var(--primary-dark);
        margin-bottom: 10px;
      }

      .recommend-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(120px, 1fr));
        gap: 8px 16px;
        margin-bottom: 12px;
        font-size: 0.92rem;
      }

      .recommend-grid .item-label {
        color: var(--muted);
        font-weight: 700;
        margin-right: 6px;
      }

      .recommend-note {
        font-size: 0.92rem;
        line-height: 1.6;
        margin-bottom: 6px;
      }

      .recommend-note strong {
        color: var(--primary-dark);
      }

      /* ===== Contact (partnership) ===== */
      .contact-section {
        margin-top: 32px;
        padding-top: 28px;
        border-top: 1px solid var(--line);
      }

      .contact-title {
        font-size: 1.3rem;
        font-weight: 800;
        text-align: center;
        margin-bottom: 4px;
      }

      .contact-subtitle {
        font-size: 0.9rem;
        color: var(--muted);
        text-align: center;
        margin-bottom: 20px;
      }

      .contact-form {
        display: grid;
        gap: 14px;
        max-width: 480px;
        margin: 0 auto;
      }

      .field {
        display: grid;
        gap: 6px;
      }

      .field label {
        font-size: 0.85rem;
        font-weight: 700;
        color: var(--muted);
      }

      .field input,
      .field textarea {
        font-family: inherit;
        font-size: 1rem;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--card-alt);
        color: var(--text);
        resize: vertical;
      }

      .field input:focus,
      .field textarea:focus {
        outline: 2px solid var(--primary);
        outline-offset: 1px;
      }

      .contact-form .primary {
        width: 100%;
      }

      .contact-status {
        display: none;
        margin-top: 4px;
        padding: 14px 16px;
        border-radius: 12px;
        text-align: center;
        font-size: 0.95rem;
      }

      .contact-status.show { display: block; }

      .contact-status.success {
        background: var(--result-bg);
        border: 1px solid var(--result-border);
        color: var(--result-text);
      }

      .contact-status.error {
        background: var(--error-bg);
        border: 1px solid var(--error-border);
        color: var(--error-text);
      }

      /* ===== Comments ===== */
      .comments-section {
        margin-top: 32px;
        padding-top: 28px;
        border-top: 1px solid var(--line);
      }

      .comments-section .contact-title {
        margin-bottom: 18px;
      }

      .comments-section #disqus_thread {
        background: var(--card);
        border-radius: 12px;
      }

      @media (max-width: 640px) {
        .content { padding: 22px 18px; }
        .header { padding: 22px 18px; }

        .theme-toggle {
          top: 12px;
          right: 12px;
          padding: 10px 12px;
        }

        .theme-toggle #themeLabel {
          display: none;
        }

        .recommend-grid {
          grid-template-columns: 1fr;
        }

        .chat-window {
          max-height: 420px;
        }
      }
    </style>
  </head>
  <body>
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="다크 모드 전환" aria-pressed="false">
      <span class="icon" id="themeIcon">🌙</span>
      <span id="themeLabel">다크 모드</span>
    </button>

    <div class="app">
      <div class="header">
        <h1>👔 남성 코디 추천 챗봇</h1>
        <div class="subtitle">체형 · 피부톤 · 상황에 맞는 코디를 추천해드려요</div>
      </div>

      <div class="content">
        <div class="chat-window" id="chatWindow" aria-live="polite"></div>

        <div class="step-panel" id="stepPanel"></div>

        <div class="contact-section">
          <div class="contact-title">🤝 제휴 문의</div>
          <div class="contact-subtitle">제휴 및 협업 제안은 아래 양식으로 보내주세요</div>

          <form class="contact-form" id="contactForm" action="https://formspree.io/f/xzedyybl" method="POST">
            <div class="field">
              <label for="contactName">이름</label>
              <input type="text" id="contactName" name="name" placeholder="홍길동" required />
            </div>

            <div class="field">
              <label for="contactEmail">이메일</label>
              <input type="email" id="contactEmail" name="email" placeholder="example@email.com" required />
            </div>

            <div class="field">
              <label for="contactMessage">문의 내용</label>
              <textarea id="contactMessage" name="message" rows="4" placeholder="제휴 제안 내용을 입력해 주세요" required></textarea>
            </div>

            <input type="text" name="_gotcha" style="display:none" tabindex="-1" autocomplete="off" />

            <button type="submit" class="primary" id="contactSubmit">문의 보내기</button>

            <div class="contact-status" id="contactStatus"></div>
          </form>
        </div>

        <div class="comments-section">
          <div class="contact-title">💬 댓글</div>
          <div id="disqus_thread"></div>
        </div>
      </div>
    </div>

    <script>
      /* ===================== 테마 토글 ===================== */
      const themeToggle = document.getElementById('themeToggle');
      const themeIcon = document.getElementById('themeIcon');
      const themeLabel = document.getElementById('themeLabel');
      const THEME_KEY = 'lotto-theme';

      function applyTheme(theme) {
        if (theme === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
          themeIcon.textContent = '☀️';
          themeLabel.textContent = '라이트 모드';
          themeToggle.setAttribute('aria-pressed', 'true');
        } else {
          document.documentElement.removeAttribute('data-theme');
          themeIcon.textContent = '🌙';
          themeLabel.textContent = '다크 모드';
          themeToggle.setAttribute('aria-pressed', 'false');
        }
      }

      function initTheme() {
        const saved = localStorage.getItem(THEME_KEY);
        if (saved) { applyTheme(saved); return; }
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        applyTheme(prefersDark ? 'dark' : 'light');
      }

      themeToggle.addEventListener('click', () => {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        const next = isDark ? 'light' : 'dark';
        applyTheme(next);
        localStorage.setItem(THEME_KEY, next);
      });

      initTheme();

      /* ===================== 스타일링 규칙 데이터 (키트 2부 기준) ===================== */

      // 2-1. 체형별 규칙
      const BODY_RULES = {
        torso_thin:   { recommend: '레이어드, 두께감 있는 소재(니트·코듀로이), 오버핏 아우터, 밝은 색', point: '볼륨은 상의 또는 아우터에 둔다' },
        torso_normal: { recommend: '대부분의 핏을 잘 소화하는 편', point: '취향과 상황 중심으로 편하게 선택해도 좋아요' },
        torso_belly:  { recommend: '세미오버핏, 어두운 단색, 세로 라인, 셔츠 아우터 겸용, 스트레이트 팬츠', point: '상의 기장은 엉덩이 중간 정도로' },
        shoulder_narrow: { recommend: '어깨선이 내려오는 오버핏, 가로 스트라이프, 패딩·항공점퍼 같은 볼륨 아우터', point: '어깨 쪽으로 시선을 모아줘요' },
        shoulder_wide:   { recommend: '라운드넥, 부드러운 소재, 와이드·세미와이드 팬츠, 래글런 소매', point: '하체에 볼륨을 줘서 균형을 맞춰요' },
        lower_thin:  { recommend: '와이드 팬츠, 카고 팬츠, 밝은 색 하의', point: '하의에 볼륨을 줘요' },
        lower_thick: { recommend: '스트레이트·세미와이드 팬츠, 어두운 하의, 긴 기장 상의', point: '하의는 어두운 단색, 상의는 밝게' },
        height_short: { recommend: '크롭~기본 기장 상의, 톤온톤 코디, 하이웨이스트', point: '상하의 색을 비슷하게 맞춰 길어 보이게' }
      };

      // 2-2. 피부톤별 색상 가이드
      const SKIN_RULES = {
        warm:    { colors: ['베이지', '카키', '브라운', '아이보리', '올리브', '머스터드', '카멜'], combo: '아이보리 니트 + 카키 팬츠 + 브라운 신발' },
        cool:    { colors: ['네이비', '그레이', '블랙', '화이트', '라벤더', '차콜'], combo: '화이트 셔츠 + 네이비 슬랙스 + 블랙 로퍼' },
        unknown: { colors: ['블랙', '화이트', '네이비', '그레이', '데님'], combo: '기본색 위주로 시작해보세요' }
      };

      // 2-3. 스타일별 아이템
      const STYLE_ITEMS = {
        casual:  { label: '캐주얼', mood: '편안한 일상', outer: '후드 집업 또는 가벼운 바람막이', top: '맨투맨 또는 후드티', bottom: '데님 팬츠 또는 코튼 팬츠', shoes: '스니커즈', acc: '캡모자' },
        street:  { label: '스트릿', mood: '자유롭고 힙한', outer: '오버핏 후디', top: '오버핏 티셔츠', bottom: '카고 팬츠', shoes: '볼륨감 있는 운동화', acc: '볼캡' },
        minimal: { label: '미니멀', mood: '깔끔하고 정돈된', outer: '단색 블루종 또는 바람막이', top: '무지 티셔츠 또는 셔츠', bottom: '슬랙스', shoes: '심플한 스니커즈', acc: '미니멀 시계' },
        amekaji: { label: '아메카지', mood: '빈티지하고 단단한', outer: '워크재킷', top: '플란넬 셔츠', bottom: '데님 또는 치노 팬츠', shoes: '워커 부츠', acc: '가죽 벨트' },
        dandy:   { label: '댄디', mood: '단정하고 성숙한', outer: '가디건 또는 코트', top: '니트 또는 셔츠', bottom: '슬랙스', shoes: '로퍼 또는 더비슈즈', acc: '가죽 시계' }
      };

      // 서로 잘 어울리는 보조 스타일 (다양한 3가지 코디 구성을 위함)
      const STYLE_ALT = {
        casual:  ['minimal', 'street'],
        street:  ['casual', 'amekaji'],
        minimal: ['dandy', 'casual'],
        amekaji: ['street', 'dandy'],
        dandy:   ['minimal', 'amekaji'],
        unknown: ['casual', 'minimal']
      };

      // 2-5. 상황별 코디 공식
      const SITUATION_RULES = {
        daily:      { label: '데일리', top: '맨투맨 또는 니트', bottom: '데님 또는 코튼 팬츠', shoes: '스니커즈' },
        date:       { label: '데이트', top: '깔끔한 셔츠나 니트', bottom: '슬랙스 또는 치노', shoes: '깨끗한 신발', note: '색은 3가지 이내로 정리해요' },
        interview:  { label: '면접', top: '흰색 또는 연한 셔츠', bottom: '네이비·차콜 슬랙스', outer: '네이비·차콜 재킷', shoes: '검정 구두', note: '벨트와 구두 색을 통일해요' },
        school:     { label: '학교·출근', top: '셔츠 또는 니트', bottom: '슬랙스 또는 치노', shoes: '로퍼 또는 깔끔한 스니커즈' },
        gathering:  { label: '모임', outer: '가벼운 재킷 또는 셔츠 아우터', top: '티셔츠', bottom: '팬츠', shoes: '깔끔한 신발' }
      };

      // 2-4. 연령대별 가이드
      const AGE_GUIDE = {
        teen: '10대라서 무신사 스탠다드, 유니클로, 스파오, 탑텐 같은 가성비 브랜드 위주로 추천할게요. 트렌드 아이템은 1개 포인트만!',
        '20s': '20대라서 개성과 트렌드를 실험해볼 수 있어요. 상황별로 코디를 다르게 가져가 볼게요.',
        '30s': '30대라서 핏과 소재감을 살린 코디 위주로, 투자할 만한 아이템 1~2개를 포함해서 추천할게요.'
      };

      // 2-8. 예산별 브랜드 예시
      const BUDGET_RULES = {
        low:  { label: '저예산', brands: '무신사 스탠다드, 스파오, 탑텐, 유니클로' },
        mid:  { label: '중간 예산', brands: '커버낫, 디스이즈네버댓, 앤더슨벨 일부, H&M, 자라' },
        high: { label: '높은 예산', brands: '논플래시, 어반드레스, 코스, 띠어리' }
      };

      const BUDGET_DOWNGRADE = { high: 'mid', mid: 'low', low: 'low' };

      /* ===================== 챗봇 질문 플로우 ===================== */

      const STEPS = [
        {
          id: 'age',
          bot: '안녕하세요! 저는 체형과 상황에 맞춰 코디를 추천해드리는 스타일봇이에요 😊\n먼저 연령대를 알려주세요.',
          groups: [{ key: 'age', options: [['10대', 'teen'], ['20대', '20s'], ['30대', '30s']] }]
        },
        {
          id: 'heightWeight',
          bot: '키와 몸무게를 알려주세요! 체형 추천에 참고할게요. (숫자만 입력, 비워두면 생략 가능해요)',
          numberFields: [{ key: 'height', label: '키(cm)' }, { key: 'weight', label: '몸무게(kg)' }]
        },
        {
          id: 'bodyTop',
          bot: '체형을 알려주세요. 어깨와 상체·복부는 어떤 편인가요?',
          groups: [
            { key: 'shoulder', label: '어깨', options: [['넓다', 'wide'], ['보통', 'normal'], ['좁다', 'narrow']] },
            { key: 'torso', label: '상체·복부', options: [['마른 편', 'thin'], ['보통', 'normal'], ['배가 나온 편', 'belly']] }
          ]
        },
        {
          id: 'bodyLower',
          bot: '하체는 어떤 편인가요?',
          groups: [{ key: 'lower', label: '하체', options: [['얇다', 'thin'], ['보통', 'normal'], ['두꺼운 편', 'thick']] }]
        },
        {
          id: 'skin',
          bot: '피부톤도 알려주세요! 손목 안쪽 혈관이 푸른빛이면 쿨톤, 초록빛이면 웜톤이에요. 사진은 필요 없어요.',
          groups: [{ key: 'tone', label: '피부톤', options: [['웜톤', 'warm'], ['쿨톤', 'cool'], ['모르겠음', 'unknown']] }]
        },
        {
          id: 'style',
          bot: '선호하는 스타일이 있나요?',
          groups: [{ key: 'style', options: [['캐주얼', 'casual'], ['스트릿', 'street'], ['미니멀', 'minimal'], ['아메카지', 'amekaji'], ['댄디', 'dandy'], ['잘 모르겠음', 'unknown']] }]
        },
        {
          id: 'situation',
          bot: '어떤 상황에 입을 옷이 필요해요?',
          groups: [{ key: 'situation', options: [['데일리', 'daily'], ['데이트', 'date'], ['면접', 'interview'], ['학교/출근', 'school'], ['모임', 'gathering']] }]
        },
        {
          id: 'budget',
          bot: '예산은 어느 정도로 생각하세요? (상의 기준)',
          groups: [{ key: 'budget', options: [['저예산 (3만원 이하)', 'low'], ['중간 (3~8만원)', 'mid'], ['높은 예산 (8만원 이상)', 'high']] }]
        }
      ];

      const chatWindow = document.getElementById('chatWindow');
      const stepPanel = document.getElementById('stepPanel');

      let state = {};
      let stepIndex = 0;
      let currentSelection = {};

      function addMessage(text, who) {
        const row = document.createElement('div');
        row.className = `message ${who}`;
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = text;
        row.appendChild(bubble);
        chatWindow.appendChild(row);
        chatWindow.scrollTop = chatWindow.scrollHeight;
        return row;
      }

      function addRichMessage(node) {
        const row = document.createElement('div');
        row.className = 'message bot';
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.style.maxWidth = '100%';
        bubble.appendChild(node);
        row.appendChild(bubble);
        chatWindow.appendChild(row);
        chatWindow.scrollTop = chatWindow.scrollHeight;
      }

      function startFlow() {
        chatWindow.innerHTML = '';
        state = {};
        stepIndex = 0;
        renderStep();
      }

      function renderStep() {
        stepPanel.innerHTML = '';
        if (stepIndex >= STEPS.length) {
          renderResult();
          return;
        }

        const step = STEPS[stepIndex];
        addMessage(step.bot, 'bot');
        currentSelection = {};

        const panel = document.createElement('div');

        if (step.groups) {
          step.groups.forEach((group) => {
            const groupEl = document.createElement('div');
            groupEl.className = 'group';

            if (group.label) {
              const labelEl = document.createElement('div');
              labelEl.className = 'group-label';
              labelEl.textContent = group.label;
              groupEl.appendChild(labelEl);
            }

            const chips = document.createElement('div');
            chips.className = 'chips';

            group.options.forEach(([label, value]) => {
              const chip = document.createElement('button');
              chip.type = 'button';
              chip.className = 'chip';
              chip.textContent = label;
              chip.addEventListener('click', () => {
                chips.querySelectorAll('.chip').forEach((c) => c.classList.remove('selected'));
                chip.classList.add('selected');
                currentSelection[group.key] = { label, value };
                updateNextButton();
              });
              chips.appendChild(chip);
            });

            groupEl.appendChild(chips);
            panel.appendChild(groupEl);
          });
        }

        if (step.numberFields) {
          const row = document.createElement('div');
          row.className = 'number-fields';
          step.numberFields.forEach((f) => {
            const fieldWrap = document.createElement('div');
            fieldWrap.className = 'field';
            const label = document.createElement('label');
            label.textContent = f.label;
            label.setAttribute('for', `num-${f.key}`);
            const input = document.createElement('input');
            input.type = 'number';
            input.id = `num-${f.key}`;
            input.min = '0';
            input.addEventListener('input', () => {
              currentSelection[f.key] = { label: input.value, value: input.value };
            });
            fieldWrap.appendChild(label);
            fieldWrap.appendChild(input);
            row.appendChild(fieldWrap);
          });
          panel.appendChild(row);
          // 키/몸무게는 입력 없이도 다음 단계로 진행 가능
          currentSelection.__optional = true;
        }

        const actions = document.createElement('div');
        actions.className = 'step-actions';
        const nextBtn = document.createElement('button');
        nextBtn.type = 'button';
        nextBtn.className = 'primary';
        nextBtn.textContent = stepIndex === STEPS.length - 1 ? '추천 받기' : '다음';
        nextBtn.id = 'nextBtn';
        nextBtn.disabled = !step.numberFields; // 선택형 질문은 선택 전까지 비활성화
        nextBtn.addEventListener('click', () => confirmStep(step));
        actions.appendChild(nextBtn);
        panel.appendChild(actions);

        stepPanel.innerHTML = '';
        stepPanel.appendChild(panel);
      }

      function updateNextButton() {
        const step = STEPS[stepIndex];
        const nextBtn = document.getElementById('nextBtn');
        if (!step.groups) return;
        const allSelected = step.groups.every((g) => currentSelection[g.key]);
        nextBtn.disabled = !allSelected;
      }

      function confirmStep(step) {
        const summaryParts = [];

        if (step.groups) {
          step.groups.forEach((g) => {
            state[g.key] = currentSelection[g.key].value;
            summaryParts.push(currentSelection[g.key].label);
          });
        }

        if (step.numberFields) {
          step.numberFields.forEach((f) => {
            const val = (currentSelection[f.key] && currentSelection[f.key].value) || '';
            state[f.key] = val;
            if (val) summaryParts.push(`${f.label} ${val}`);
          });
          if (summaryParts.length === 0) summaryParts.push('알려주지 않음');
        }

        addMessage(summaryParts.join(' / '), 'user');
        stepIndex += 1;
        renderStep();
      }

      /* ===================== 추천 생성 로직 ===================== */

      function pickBodyNote(s) {
        // 상체·복부 > 어깨 > 하체 > 보통 순으로 특징이 뚜렷한 항목을 우선 반영
        if (s.torso === 'thin') return BODY_RULES.torso_thin;
        if (s.torso === 'belly') return BODY_RULES.torso_belly;
        if (s.shoulder === 'narrow') return BODY_RULES.shoulder_narrow;
        if (s.shoulder === 'wide') return BODY_RULES.shoulder_wide;
        if (s.lower === 'thin') return BODY_RULES.lower_thin;
        if (s.lower === 'thick') return BODY_RULES.lower_thick;
        return BODY_RULES.torso_normal;
      }

      function buildOutfit(styleKey, s, index) {
        const style = STYLE_ITEMS[styleKey] || STYLE_ITEMS.casual;
        const situation = SITUATION_RULES[s.situation] || SITUATION_RULES.daily;
        const skin = SKIN_RULES[s.tone] || SKIN_RULES.unknown;
        const budget = BUDGET_RULES[s.budget] || BUDGET_RULES.low;
        const bodyNote = pickBodyNote(s);

        const items = {
          outer: situation.outer || style.outer,
          top: situation.top || style.top,
          bottom: situation.bottom || style.bottom,
          shoes: situation.shoes || style.shoes,
          acc: style.acc
        };

        if (s.situation === 'interview') {
          items.acc = '벨트와 구두 색 통일';
        }

        const heightNum = parseInt(s.height, 10);
        const shortNote = !isNaN(heightNum) && heightNum > 0 && heightNum < 170
          ? ` 키가 170 미만이면 ${BODY_RULES.height_short.point}.`
          : '';

        const reasonText =
          `${bodyNote.recommend} 스타일이라 이 핏이 잘 어울려요. ${bodyNote.point}.` +
          `${shortNote} ${situation.note ? situation.note + '. ' : ''}` +
          `${skin.colors.slice(0, 2).join('·')} 컬러가 피부톤과 잘 맞아서 ${situation.label} 자리에서 자연스러워요.`;

        return {
          title: `${style.label} ${situation.label}룩`,
          mood: style.mood,
          items,
          reason: reasonText.trim(),
          brands: budget.brands,
          colorTip: skin.combo
        };
      }

      function renderOutfitCard(outfit) {
        const card = document.createElement('div');
        card.className = 'recommend-card';

        const title = document.createElement('div');
        title.className = 'recommend-title';
        title.textContent = `✨ ${outfit.title}`;
        card.appendChild(title);

        const grid = document.createElement('div');
        grid.className = 'recommend-grid';
        const slots = [
          ['아우터', outfit.items.outer],
          ['상의', outfit.items.top],
          ['하의', outfit.items.bottom],
          ['신발', outfit.items.shoes],
          ['액세서리', outfit.items.acc]
        ];
        slots.forEach(([label, value]) => {
          const item = document.createElement('div');
          item.innerHTML = `<span class="item-label">${label}</span>${value}`;
          grid.appendChild(item);
        });
        card.appendChild(grid);

        const reason = document.createElement('div');
        reason.className = 'recommend-note';
        reason.innerHTML = `<strong>추천 이유</strong> ${outfit.reason}`;
        card.appendChild(reason);

        const brand = document.createElement('div');
        brand.className = 'recommend-note';
        brand.innerHTML = `<strong>브랜드 예시</strong> ${outfit.brands}`;
        card.appendChild(brand);

        const color = document.createElement('div');
        color.className = 'recommend-note';
        color.innerHTML = `<strong>색 조합 팁</strong> ${outfit.colorTip}`;
        card.appendChild(color);

        return card;
      }

      function assumptionNotes(s) {
        const notes = [];
        if (s.tone === 'unknown') notes.push('피부톤 정보가 없어서 무난한 기본 컬러(블랙·화이트·네이비·그레이)로 가정했어요.');
        if (s.style === 'unknown') notes.push('선호 스타일 정보가 없어서 무난한 캐주얼/미니멀 느낌으로 가정했어요.');
        return notes;
      }

      function renderResult() {
        const s = state;
        const primaryStyle = s.style === 'unknown' ? 'casual' : s.style;
        const altStyles = STYLE_ALT[primaryStyle] || STYLE_ALT.unknown;
        const styleKeys = [primaryStyle, ...altStyles];

        const introParts = [];
        if (AGE_GUIDE[s.age]) introParts.push(AGE_GUIDE[s.age]);
        introParts.push(...assumptionNotes(s));
        introParts.push('입력해주신 정보로 코디 3가지를 추천해드릴게요!');
        addMessage(introParts.join('\n'), 'bot');

        const wrap = document.createElement('div');
        wrap.className = 'recommend-wrap';
        styleKeys.forEach((styleKey, i) => {
          const outfit = buildOutfit(styleKey, s, i);
          wrap.appendChild(renderOutfitCard(outfit));
        });
        addRichMessage(wrap);

        renderFollowUp();
      }

      function renderFollowUp() {
        addMessage('더 캐주얼하게 / 더 단정하게 / 예산 낮춰서 다시 추천해드릴까요?', 'bot');

        const panel = document.createElement('div');
        const quick = document.createElement('div');
        quick.className = 'quick-replies';

        const makeBtn = (label, handler) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'secondary';
          btn.textContent = label;
          btn.addEventListener('click', handler);
          return btn;
        };

        quick.appendChild(makeBtn('더 캐주얼하게', () => {
          addMessage('더 캐주얼하게', 'user');
          state.style = 'casual';
          renderResult();
        }));

        quick.appendChild(makeBtn('더 단정하게', () => {
          addMessage('더 단정하게', 'user');
          state.style = 'dandy';
          renderResult();
        }));

        quick.appendChild(makeBtn('예산 낮춰서 다시', () => {
          addMessage('예산 낮춰서 다시', 'user');
          state.budget = BUDGET_DOWNGRADE[state.budget] || 'low';
          renderResult();
        }));

        quick.appendChild(makeBtn('처음부터 다시', () => {
          startFlow();
        }));

        panel.appendChild(quick);
        stepPanel.innerHTML = '';
        stepPanel.appendChild(panel);
      }

      startFlow();

      /* ===================== 제휴 문의 폼 (Formspree) ===================== */
      const contactForm = document.getElementById('contactForm');
      const contactSubmit = document.getElementById('contactSubmit');
      const contactStatus = document.getElementById('contactStatus');

      contactForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        contactStatus.classList.remove('show', 'success', 'error');
        contactSubmit.disabled = true;
        contactSubmit.textContent = '보내는 중...';

        try {
          const response = await fetch(contactForm.action, {
            method: 'POST',
            body: new FormData(contactForm),
            headers: { Accept: 'application/json' }
          });

          if (response.ok) {
            contactStatus.textContent = '✅ 문의가 접수되었습니다. 빠른 시일 내에 답변드리겠습니다!';
            contactStatus.classList.add('show', 'success');
            contactForm.reset();
          } else {
            const data = await response.json().catch(() => null);
            const message = data && data.errors ? data.errors.map((e) => e.message).join(', ') : '';
            contactStatus.textContent = `⚠️ 전송에 실패했습니다. ${message || '잠시 후 다시 시도해 주세요.'}`;
            contactStatus.classList.add('show', 'error');
          }
        } catch (error) {
          contactStatus.textContent = '⚠️ 네트워크 오류로 전송하지 못했습니다. 잠시 후 다시 시도해 주세요.';
          contactStatus.classList.add('show', 'error');
        } finally {
          contactSubmit.disabled = false;
          contactSubmit.textContent = '문의 보내기';
        }
      });
    </script>
